<svg xmlns="http://www.w3.org/2000/svg" width="220" height="24" viewBox="0 0 220 24" fill="none">
  <style>
    .label {
      fill: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 500;
    }
    .name {
      fill: #00F2FE;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      transition: fill 0.2s ease;
    }
    .name:hover {
      fill: #4FACFE;
    }
    @media (prefers-color-scheme: light) {
      .label { fill: #24292f; }
      .name { fill: #0969da; }
      .name:hover { fill: #0550ae; }
    }
  </style>
  <text x="50%" y="17" text-anchor="middle">
    <tspan class="label">Designed by </tspan>
    <tspan class="name">Anil Adhikari</tspan>
  </text>
</svg>
