<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Deep Cyber Navy Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="30%" stop-color="#081A30" />
      <stop offset="70%" stop-color="#0F2D4E" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#1E3E62" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#0A66C2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.6" />
    </linearGradient>

    <!-- Wave Gradient 1 -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06182C" />
      <stop offset="50%" stop-color="#13446C" />
      <stop offset="100%" stop-color="#06182C" />
    </linearGradient>

    <!-- Wave Gradient 2 -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#092642" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#092642" />
    </linearGradient>

    <!-- Green Badge Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2EA043" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <!-- Cyan Badge Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Official Instagram Gradient -->
    <linearGradient id="instaGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#515BD4"/>
      <stop offset="25%" stop-color="#8134AF"/>
      <stop offset="50%" stop-color="#DD2A7B"/>
      <stop offset="75%" stop-color="#F58529"/>
      <stop offset="100%" stop-color="#FEDA77"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Subtle Cyan Glow for Hero Name -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F2FE" flood-opacity="0.35"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#00F2FE" opacity="0.10"/>
    </pattern>

    <!-- Badge Clip Paths for rounded split pills -->
    <clipPath id="openToClip">
      <rect x="28" y="20" width="252" height="28" rx="6" />
    </clipPath>
    <clipPath id="viewsClip">
      <rect x="792" y="20" width="180" height="28" rx="6" />
    </clipPath>
  </defs>

  <style>
    .banner-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      dominant-baseline: middle;
    }
    .hover-icon {
      transition: transform 0.25s ease, opacity 0.25s ease;
      cursor: pointer;
    }
    .hover-icon:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }
  </style>

  <!-- ========================================== -->
  <!-- [A] BASE CARD WITH CYBERTECH THEME        -->
  <!-- ========================================== -->
  <!-- Outer Rounded Banner Card -->
  <rect width="1000" height="240" rx="14" fill="url(#bgGrad)" />
  
  <!-- Subtle Ambient Tech Dot Grid -->
  <rect width="1000" height="240" rx="14" fill="url(#techGrid)" />
  
  <!-- Sleek Glowing Card Border -->
  <rect x="0.5" y="0.5" width="999" height="239" rx="13.5" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Animated Bottom Cyber Waves -->
  <g opacity="0.40">
    <path fill="url(#waveGrad1)">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M0 190 Q 250 220 500 198 T 1000 205 L 1000 240 L 0 240 Z;
                M0 205 Q 250 185 500 215 T 1000 195 L 1000 240 L 0 240 Z;
                M0 190 Q 250 220 500 198 T 1000 205 L 1000 240 L 0 240 Z" />
    </path>
  </g>
  <g opacity="0.22">
    <path fill="url(#waveGrad2)">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
        values="M0 210 Q 250 190 500 220 T 1000 200 L 1000 240 L 0 240 Z;
                M0 195 Q 250 225 500 195 T 1000 215 L 1000 240 L 0 240 Z;
                M0 210 Q 250 190 500 220 T 1000 200 L 1000 240 L 0 240 Z" />
    </path>
  </g>

  <!-- ========================================== -->
  <!-- [1] TOP-LEFT BADGE: OPEN TO COLLABORATIONS -->
  <!-- Flush left at x=28, y=20 (Width=252, H=28)-->
  <!-- ========================================== -->
  <g filter="url(#cardShadow)" class="hover-icon">
    <a xlink:href="https://github.com/aniladhikaritech" target="_blank">
      <g clip-path="url(#openToClip)">
        <!-- Left Segment: GitHub Dark Charcoal -->
        <rect x="28" y="20" width="78" height="28" fill="#161B22" />
        <!-- GitHub Octocat Mark -->
        <path fill="#FFFFFF" transform="translate(36, 26) scale(0.65)" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
        <text x="58" y="35" class="badge-text" fill="#E6EDF3" font-size="10.5" font-weight="700" letter-spacing="0.6px">OPEN TO</text>
        
        <!-- Right Segment: Vibrant GitHub Emerald -->
        <rect x="106" y="20" width="174" height="28" fill="url(#greenGrad)" />
        <text x="116" y="35" class="badge-text" fill="#FFFFFF" font-size="10.5" font-weight="800" letter-spacing="0.4px">COLLABORATIONS &amp; PROJECTS</text>
      </g>
      <!-- Sleek Container Border -->
      <rect x="28" y="20" width="252" height="28" rx="6" fill="none" stroke="#30363D" stroke-width="0.9" />
    </a>
  </g>

  <!-- ========================================== -->
  <!-- [2] TOP-RIGHT BADGE: PROFILE VIEWS         -->
  <!-- Flush right at x=792 (Ends at 972, w=180)  -->
  <!-- ========================================== -->
  <g filter="url(#cardShadow)" class="hover-icon">
    <a xlink:href="https://github.com/aniladhikaritech" target="_blank">
      <g clip-path="url(#viewsClip)">
        <!-- Left Segment: GitHub Dark Charcoal -->
        <rect x="792" y="20" width="130" height="28" fill="#161B22" />
        <!-- Eye / Views Glyph Icon -->
        <path fill="#58A6FF" transform="translate(802, 27) scale(0.68)" d="M10 4.5C5.5 4.5 1.73 7.61 0 12c1.73 4.39 5.5 7.5 10 7.5s8.27-3.11 10-7.5c-1.73-4.39-5.5-7.5-10-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
        <text x="822" y="35" class="badge-text" fill="#E6EDF3" font-size="10.5" font-weight="700" letter-spacing="0.8px">PROFILE VIEWS</text>
        
        <!-- Right Segment: Vibrant Cyber Cyan -->
        <rect x="922" y="20" width="50" height="28" fill="url(#cyanGrad)" />
        <text x="935" y="35" class="badge-text" fill="#040A14" font-size="13" font-weight="900" letter-spacing="0.3px">30+</text>
      </g>
      <!-- Sleek Container Border -->
      <rect x="792" y="20" width="180" height="28" rx="6" fill="none" stroke="#30363D" stroke-width="0.9" />
    </a>
  </g>

  <!-- ========================================== -->
  <!-- [3] BOTTOM-LEFT: INSTAGRAM LOGO (DARK)     -->
  <!-- Flush left at x=28, y=174 (Matches top!)   -->
  <!-- ========================================== -->
  <g transform="translate(28, 174)" filter="url(#cardShadow)" class="hover-icon">
    <a xlink:href="https://www.instagram.com/" target="_blank">
      <!-- Dark rounded glass background -->
      <rect width="42" height="42" rx="11" fill="#161B22" stroke="#30363D" stroke-width="1.1" />
      <!-- Instagram Camera Glyph with Official Gradient -->
      <rect x="9.5" y="9.5" width="23" height="23" rx="6.5" fill="none" stroke="url(#instaGrad)" stroke-width="2.3" />
      <circle cx="21" cy="21" r="5.3" fill="none" stroke="url(#instaGrad)" stroke-width="2.3" />
      <circle cx="26.8" cy="15.2" r="1.4" fill="url(#instaGrad)" />
    </a>
  </g>

  <!-- ========================================== -->
  <!-- [4] BOTTOM-RIGHT: LINKEDIN LOGO (DARK)     -->
  <!-- Flush right at x=930 (Ends at 972!)        -->
  <!-- ========================================== -->
  <g transform="translate(930, 174)" filter="url(#cardShadow)" class="hover-icon">
    <a xlink:href="https://www.linkedin.com/in/aniladhikaritech/" target="_blank">
      <!-- Dark rounded glass background with LinkedIn accent border -->
      <rect width="42" height="42" rx="11" fill="#161B22" stroke="#30363D" stroke-width="1.1" />
      <!-- Official LinkedIn Blue In Icon Box -->
      <rect x="6" y="6" width="30" height="30" rx="6" fill="#0A66C2" />
      <!-- LinkedIn 'in' Text Vector -->
      <g fill="#FFFFFF" transform="translate(1.5, 0.5)">
        <circle cx="14.5" cy="13.5" r="2.2" />
        <rect x="12.5" y="17.5" width="4" height="11.5" rx="0.8" />
        <path d="M19.5 17.5h3.8v1.7h.1c.5-.9 1.9-2 3.9-2 4.1 0 4.9 2.7 4.9 6.2v6.1h-4v-5.4c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9v5.5h-4v-11.5z" />
      </g>
    </a>
  </g>

  <!-- ========================================== -->
  <!-- CENTER TYPOGRAPHY HIERARCHY (PERFECT FIT)  -->
  <!-- ========================================== -->
  <g class="banner-text">
    <!-- Line 1: Hi There -->
    <text x="500" y="58" fill="#79C0FF" font-size="18" font-weight="600" letter-spacing="0.8px">Hi There</text>

    <!-- Line 2: I’m ✧ ANIL ADHIKARI ✧ -->
    <text x="500" y="100" fill="#FFFFFF" font-size="34" font-weight="800" letter-spacing="1.2px" filter="url(#cyanGlow)">I’m <tspan fill="#00F2FE">✧</tspan> ANIL ADHIKARI <tspan fill="#00F2FE">✧</tspan></text>

    <!-- Line 3: Cybersecurity • Computer Engineering -->
    <text x="500" y="142" fill="#E6EDF3" font-size="19" font-weight="600" letter-spacing="0.5px">Cybersecurity <tspan fill="#00F2FE">•</tspan> Computer Engineering</text>

    <!-- Line 4: Welcome Tagline -->
    <text x="500" y="176" fill="#00F2FE" font-size="14" font-weight="600" letter-spacing="0.8px">✨ Welcome to my Official GitHub Profile ✨</text>
  </g>
</svg>