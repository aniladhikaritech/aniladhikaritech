<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 950 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050E1A" />
      <stop offset="50%" stop-color="#0E2A47" />
      <stop offset="100%" stop-color="#050E1A" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071A2F" />
      <stop offset="50%" stop-color="#184E77" />
      <stop offset="100%" stop-color="#071A2F" />
    </linearGradient>

    <!-- Instagram Gradient -->
    <linearGradient id="instaGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#515BD4"/>
      <stop offset="25%" stop-color="#8134AF"/>
      <stop offset="50%" stop-color="#DD2A7B"/>
      <stop offset="75%" stop-color="#F58529"/>
      <stop offset="100%" stop-color="#FEDA77"/>
    </linearGradient>

    <!-- Badge Clip Paths -->
    <clipPath id="openToClip">
      <rect x="20" y="16" width="245" height="28" rx="4" />
    </clipPath>
    <clipPath id="viewsClip">
      <rect x="755" y="16" width="175" height="28" rx="4" />
    </clipPath>
  </defs>

  <style>
    .banner-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      dominant-baseline: middle;
    }
  </style>

  <!-- Banner Background -->
  <rect width="950" height="220" fill="url(#bgGrad)" />

  <!-- Animated Bottom Waves -->
  <g opacity="0.45">
    <path fill="url(#waveGrad)">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M0 160 Q 237.5 190 475 170 T 950 175 L 950 220 L 0 220 Z;
                M0 175 Q 237.5 155 475 185 T 950 165 L 950 220 L 0 220 Z;
                M0 160 Q 237.5 190 475 170 T 950 175 L 950 220 L 0 220 Z" />
    </path>
  </g>
  <g opacity="0.3">
    <path fill="#00F2FE">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
        values="M0 180 Q 237.5 160 475 190 T 950 170 L 950 220 L 0 220 Z;
                M0 165 Q 237.5 195 475 165 T 950 185 L 950 220 L 0 220 Z;
                M0 180 Q 237.5 160 475 190 T 950 170 L 950 220 L 0 220 Z" />
    </path>
  </g>

  <!-- ========================================== -->
  <!-- [1] TOP-LEFT BADGE: OPEN TO COLLABORATIONS -->
  <!-- ========================================== -->
  <g clip-path="url(#openToClip)">
    <!-- Left Segment: Charcoal with Octocat -->
    <rect x="20" y="16" width="75" height="28" fill="#2D333B" />
    <!-- GitHub Octocat SVG Path -->
    <path fill="#FFFFFF" transform="translate(28, 22) scale(0.65)" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
    <text x="50" y="31" class="badge-text" fill="#FFFFFF" font-weight="700">OPEN TO</text>
    
    <!-- Right Segment: Bright Green -->
    <rect x="95" y="16" width="170" height="28" fill="#238636" />
    <text x="105" y="31" class="badge-text" fill="#FFFFFF" font-weight="800" letter-spacing="0.3px">COLLABORATIONS &amp; PROJECTS</text>
  </g>
  <!-- Thin border for badge -->
  <rect x="20" y="16" width="245" height="28" rx="4" fill="none" stroke="#444C56" stroke-width="0.7" />

  <!-- ========================================== -->
  <!-- [2] TOP-RIGHT BADGE: PROFILE VIEWS         -->
  <!-- ========================================== -->
  <g clip-path="url(#viewsClip)">
    <!-- Left Segment: Charcoal -->
    <rect x="755" y="16" width="130" height="28" fill="#2D333B" />
    <text x="768" y="31" class="badge-text" fill="#E6EDF3" font-weight="700" letter-spacing="0.8px">PROFILE VIEWS</text>
    
    <!-- Right Segment: Vibrant Cyan -->
    <rect x="885" y="16" width="45" height="28" fill="#00F2FE" />
    <text x="897" y="31" class="badge-text" fill="#050E1A" font-weight="900" font-size="13px">30+</text>
  </g>
  <!-- Thin border for badge -->
  <rect x="755" y="16" width="175" height="28" rx="4" fill="none" stroke="#444C56" stroke-width="0.7" />

  <!-- ========================================== -->
  <!-- [3] BOTTOM-LEFT: INSTAGRAM LOGO (DARK)     -->
  <!-- ========================================== -->
  <g transform="translate(24, 150)">
    <!-- Dark rounded background square -->
    <rect width="44" height="44" rx="11" fill="#111827" stroke="#374151" stroke-width="1.2" />
    <!-- Instagram Camera Glyph with Gradient -->
    <rect x="9" y="9" width="26" height="26" rx="7.5" fill="none" stroke="url(#instaGrad)" stroke-width="2.6" />
    <circle cx="22" cy="22" r="6" fill="none" stroke="url(#instaGrad)" stroke-width="2.6" />
    <circle cx="28.5" cy="15.5" r="1.5" fill="url(#instaGrad)" />
  </g>

  <!-- ========================================== -->
  <!-- [4] BOTTOM-RIGHT: LINKEDIN LOGO (DARK)     -->
  <!-- ========================================== -->
  <g transform="translate(882, 150)">
    <!-- LinkedIn Official Blue Rounded Square -->
    <rect width="44" height="44" rx="10" fill="#0A66C2" />
    <!-- LinkedIn 'in' Text Vector -->
    <g fill="#FFFFFF">
      <!-- 'i' dot & stem -->
      <circle cx="15.5" cy="15" r="2.5" />
      <rect x="13.2" y="19.5" width="4.6" height="13.5" rx="1" />
      <!-- 'n' stem & arch -->
      <path d="M21.2 19.5h4.4v2h.1c.6-1.1 2.2-2.3 4.5-2.3 4.8 0 5.7 3.2 5.7 7.3v6.5h-4.6v-5.8c0-1.4 0-3.2-2-3.2s-2.3 1.5-2.3 3.1v5.9h-4.6v-13.5z" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- CENTER TYPOGRAPHY HIERARCHY                -->
  <!-- ========================================== -->
  <g class="banner-text">
    <!-- Line 1: Hi There -->
    <text x="475" y="60" fill="#FFFFFF" font-size="22" font-weight="700" letter-spacing="0.5px">Hi There</text>

    <!-- Line 2: I’m ✧ ANIL ADHIKARI ✧ -->
    <text x="475" y="98" fill="#FFFFFF" font-size="30" font-weight="800" letter-spacing="0.8px">I’m ✧ ANIL ADHIKARI ✧</text>

    <!-- Line 3: Cybersecurity • Computer Engineering -->
    <text x="475" y="136" fill="#FFFFFF" font-size="20" font-weight="600" letter-spacing="0.3px">Cybersecurity • Computer Engineering</text>

    <!-- Line 4: Welcome to my Official GitHub Profile -->
    <text x="475" y="168" fill="#00F2FE" font-size="15" font-weight="600" letter-spacing="0.5px">✨ Welcome to my Official GitHub Profile ✨</text>
  </g>
</svg>